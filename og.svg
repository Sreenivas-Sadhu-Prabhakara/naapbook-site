<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NaapBook — every naap saved, every order on time. A KARYA studio build.">
  <title>NaapBook — every naap saved, every order on time</title>

  <!-- soft paper base -->
  <rect width="1200" height="630" fill="#F7F5FB"/>

  <!-- faint ledger rules -->
  <g stroke="#E5DFF0" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- violet accent band down the left, like an order-book margin -->
  <rect x="0" y="0" width="18" height="630" fill="#7c3aed"/>
  <rect x="90" y="0" width="2" height="630" fill="#E6DEFA"/>

  <!-- logo mark -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#7c3aed"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#5B21B6"/>
    <path d="M32 22h30M32 36h30M32 50h20" stroke="#F7F5FB" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#1E1830">Naap</tspan><tspan fill="#7c3aed">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#1E1830">Every naap saved.</text>
  <text x="96" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#7c3aed">Every order on time.</text>

  <!-- tagline -->
  <text x="98" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#524B63">Measurement vault &amp; stitching-order tracker for tailors &amp; boutiques.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#7c3aed"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F7F5FB">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#524B63">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini delivery-board chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#D6CDEB" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#1E1830">Delivery board</text>
    <rect x="238" y="24" width="54" height="26" rx="13" fill="#E6DEFA"/>
    <text x="265" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Live</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#524B63">Imran · Kurta</text>
    <rect x="176" y="76" width="116" height="24" rx="12" fill="#F7E4D6"/>
    <text x="234" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#C2410C">2 days overdue</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#524B63">Farhan · 3 Shirts</text>
    <rect x="188" y="116" width="104" height="24" rx="12" fill="#7c3aed"/>
    <text x="240" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F7F5FB">Ready</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#E5DFF0" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#524B63">Ready to hand over</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#7c3aed">2 orders</text>
  </g>
</svg>
